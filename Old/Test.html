<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css">

    <style>
        img {
            height: 80vh;
            width: 100%;
        }
    </style>
</head>

<body>
    <div id="a" class="carousel slide carousel-fade" data-bs-ride="carousel" data-bs-touch="false">

        <div class="carousel-indicators">
            <button type="button" data-bs-target="#a" data-bs-slide-to="0" class="active"></button>

            <button type="button" data-bs-target="#a" data-bs-slide-to="1" aria-label="Slide 2"></button>

            <button type="button" data-bs-target="#a" data-bs-slide-to="2" aria-label="Slide 3"></button>
            <button type="button" data-bs-target="#a" data-bs-slide-to="3" aria-label="Slide 3"></button>

        </div>

        <div class="carousel-inner">
            <div class="carousel-item active " data-bs-interval="2000">
                <img src="https://images.unsplash.com/photo-1761839258289-72f12b0de058?q=80&w=1170&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=M3wxMjA3fDF8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D"
                    alt="">
            </div>
            <div class="carousel-item  " data-bs-interval="1000">
                <img src="https://images.unsplash.com/photo-1773058373644-74e4120bfc77?q=80&w=1632&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D"
                    alt="">
            </div>
            <div class="carousel-item  " data-bs-interval="4000">
                <img src="https://images.unsplash.com/photo-1773486529602-62be6e363101?q=80&w=1632&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D"
                    alt="">
            </div>
            <div class="carousel-item  " data-bs-interval="1500">
                <img src="https://plus.unsplash.com/premium_photo-1773309079167-d479563cb025?q=80&w=1170&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D"
                    alt="">
            </div>
        </div>

        <button class="carousel-control-prev" type="button" data-bs-target="#a" data-bs-slide="prev">
            <span class="carousel-control-prev-icon"></span>
        </button>
        <button class="carousel-control-next" type="button" data-bs-target="#a" data-bs-slide="next">
            <span class="carousel-control-next-icon"></span>

        </button>
    </div>
</body>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>

</html>
