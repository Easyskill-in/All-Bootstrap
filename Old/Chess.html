    <style>
        *,

            padding: 0;

        }

            line-height: 1.6;

            width: 70%;
            background-color: #E3DAC9;
            display: grid;
            grid-template-columns: repeat(8, 1fr);
            text-align: center;
        }

        .b {
            background-color: #9F8170;
        }

        .w {
            background-color: #F5F5DC;
        }

        .
