<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="gdr.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Fjalla+One&family=Saira:ital,wght@0,100..900;1,100..900&family=Titan+One&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css" />
</head>

<body>
    <!-- ---------------- HEADER ------------------ -->
    <header class="headder">
        <div class="navbar-custom container-fluid">
            <div class="logo">
                GDR
            </div>
            <ul class="nav-menu">

                <li><a href="#">about</a></li>
                <li><a href="#">service</a></li>
                <li><a href="#">blog</a></li>
                <li><a href="#">contact</a></li>
            </ul>


            <!-- =========search section in nav bar======== -->
            <div class="search_section">


                <input type="text" class="search text-center" placeholder="search topic">



                <button type="submit" class="btn btn-success">
                    <i class="fa-solid fa-paper-plane" style="color: rgb(20, 10, 10);"></i>
                </button>
            </div>

            <!-- ----------------login button-------------- -->
            <div class="btnbtn">

                <!-- LOGIN BUTTON -->
                <button class="login btn" data-bs-toggle="modal" data-bs-target="#loginform">
                    sign-in
                </button>

            </div>
            <!-- MODAL -->





        </div> <!-- =============modal code======================== -->


    </header>
    <div class="modal fade" id="loginform" data-bs-backdrop="static" data-bs-keyboard="false" tabindex="-1"
        aria-hidden="true">

        <div class="modal-dialog modal-dialog-centered">

            <div class="modal-content">

                <!-- HEADER -->
                <div class="modal-header">

                    <div class="register text-center mx-auto">
                        <h1>REGISTER</h1>
                        <h6>signup now and get full access to our app</h6>
                    </div>

                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close">
                    </button>

                </div>

                <!-- BODY -->
                <div class="modal-body">

                    <input type="text" class="form-control mb-3 text-center" placeholder="NAME">

                    <input type="email" class="form-control mb-3 text-center" placeholder="EMAIL">

                    <input type="password" class="form-control mb-3 text-center" placeholder="Create Password">

                    <input type="password" class="form-control text-center" placeholder="Confirm Password">

                </div>

                <!-- FOOTER -->
                <div class="modal-footer">

                    <button type="button" class="btn btn-primary" data-bs-dismiss="modal">
                        Submit
                    </button>

                </div>

            </div>
        </div>


    </div>
</body>
<script src="	https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js
"></script>

</html>
