<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Bootstrap demo</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        form {
            border-radius: 8px;
        }

        .username {
            /* background-color: red; */
        }

        .email {
            /* background-color: blue; */
        }

        .username,
        .email,
        .select,
        .form-check,
        .gp,
        .float {
            padding: 10px;
            width: 85%;
        }


        input::placeholder {

            /* font-style: italic; */
            /* text-align: center; */
            opacity: 1;
            /* Essential for Firefox consistency */
        }
    </style>
</head>

<body>
    <h1>Hello, world!</h1>
    <hr>
    <form action="" class="d-flex flex-column justify-content-center align-items-center"
        style="width: 400px; background-color: lightblue; padding: 10px; margin: 0 auto;">
        <div class="username ">

            <label for="UID" class="form-label ">Username</label>
            <input type="text" placeholder="Enter Your Username" class="form-control w-75" id="UID">
        </div>
        <div class="email">
            <label for="EID" class="form-label">Email address</label>
            <input type="email" placeholder="Enter Your Email" class="form-control w-75" id="EID">
        </div>
        <div class="select">
            <select name="" id="" class="form-select w-75">
                <option hidden>Select Your Choice</option>
                <option value="Item1">Item 1</option>
                <option value="Item2">Item 2</option>
                <option value="Item3">Item 3</option>
                <option value="Item4">Item 4</option>
                <option value="Item5">Item 5</option>
                <option value="Item6">Item 6</option>
                <option value="Item7">Item 7</option>
                <option value="Item8">Item 8</option>
            </select>
        </div>
        <hr>
        <div class="form-check w-75">
            <input type="checkbox" class="form-check-input" id="check"">
            <label class=" form-check-label" for="check">
            Are You Sure?
            </label>
        </div>
        <hr>
        <div class="gp">
            <div class="input-group mb-3">
                <span class="input-group-text">@</span>
                <input type="text" class="form-control" placeholder="Username">
            </div>
            <div class="input-group mb-3">
                <!-- <span class="input-group-text">www.</span> -->
                <input type="email" class="form-control" placeholder="Email">
                <span class="input-group-text">@gmail.com</span>
            </div>
        </div>

        <div class="float">
            <div class="form-floating mb-3">
                <input type="email" class="form-control" id="floatingInput" placeholder="name@example.com">
                <label for="floatingInput">Email address</label>
            </div>
            <div class="form-floating">
                <input type="password" class="form-control" id="floatingPassword" placeholder="Password">
                <label for="floatingPassword">Password</label>
            </div>
        </div>

        <button class="btn btn-success">Submit</button>
        <!-- <input type="range" class="form-range"> -->
    </form>
</body>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>

</html>
